name: JARVIS live backup verifier publication
on:
  push:
    branches:
      - main
    paths:
      - 'backup-verify-offline.html'
      - 'tests/live-backup-pages-parity.mjs'
      - '.github/workflows/live-backup-pages.yml'
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-publication-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verified repository source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public page is byte-identical to main
        run: node tests/live-backup-pages-parity.mjs
